<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS AI</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020500;color:#efffb0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center}.app{width:100%;max-width:700px;min-height:100vh;padding:18px 14px;display:flex;flex-direction:column}h1{text-align:center;margin:8px 0 4px;font-size:32px;letter-spacing:8px;color:#eaff55;text-shadow:0 0 12px #dfff22}.status{text-align:center;font-size:12px;color:#9fb65b;margin-bottom:14px}.holo{height:190px;display:flex;align-items:center;justify-content:center;position:relative}.core{width:115px;height:115px;border:2px solid #eaff55;border-radius:50%;box-shadow:0 0 18px #dfff22,0 0 55px #a8c900 inset;animation:pulse 2s infinite}.ring{position:absolute;width:165px;height:52px;border:2px solid #dfff22;border-radius:50%;transform:rotate(-12deg)}.ring2{position:absolute;width:145px;height:145px;border:1px solid #b7d719;border-radius:50%;animation:spin 7s linear infinite}@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}@keyframes spin{to{transform:rotate(360deg)}}.chat{flex:1;border:1px solid #53630e;border-radius:18px;padding:12px;background:#0c1200;overflow:auto;min-height:230px}.msg{padding:10px 12px;margin:8px 0;border-radius:13px;line-height:1.4;white-space:pre-wrap}.user{background:#293500;border:1px solid #647c12}.ai{background:#0b1200;border:1px solid #3d4d08}.controls{display:flex;gap:8px;margin-top:10px}input{flex:1;padding:14px;border-radius:13px;border:1px solid #687d16;background:#050800;color:#efffb0;font-size:16px;outline:none}button{border:1px solid #dfff22;background:#dfff22;color:#111900;font-weight:800;border-radius:13px;padding:0 18px;font-size:15px}</style></head><body><div class="app"><h1>JARVIS</h1><div class="status" id="status">ONLINE • AI CORE READY</div><div class="holo"><div class="ring"></div><div class="ring2"></div><div class="core"></div></div><div class="chat" id="chat"><div class="msg ai">JARVIS: Hello. I'm ready. Ask me anything.</div></div><div class="controls"><input id="input" placeholder="Talk to JARVIS..." autocomplete="off"><button id="send">SEND</button></div></div><script>const input=document.getElementById("input"),send=document.getElementById("send"),chat=document.getElementById("chat"),status=document.getElementById("status"),messages=[];function add(role,text){const d=document.createElement("div");d.className="msg "+(role==="user"?"user":"ai");d.textContent=(role==="user"?"YOU: ":"JARVIS: ")+text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function talk(){const text=input.value.trim();if(!text||send.disabled)return;input.value="";add("user",text);messages.push({role:"user",content:text});send.disabled=true;status.textContent="THINKING • JARVIS AI";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});const data=await r.json();if(!r.ok)throw new Error(data.error);add("assistant",data.reply);messages.push({role:"assistant",content:data.reply})}catch(e){add("assistant","Connection error. Check the JARVIS server/API setup.")}finally{send.disabled=false;status.textContent="ONLINE • AI CORE READY";input.focus()}}send.onclick=talk;input.addEventListener("keydown",e=>{if(e.key==="Enter")talk()});</script></body></html>
